# Descripción del proyecto de Xcode. El .xcodeproj se genera a partir de aquí:
#   make project      (o: cd App && xcodegen)
# No edites TaylorZwift.xcodeproj a mano: los cambios se pierden al regenerarlo.
name: TaylorZwift
options:
  bundleIdPrefix: studio.martillo
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  CicloKit:
    path: ../CicloKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TaylorZwift:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Sources
    dependencies:
      - package: CicloKit
        product: CicloKit
      - package: CicloKit
        product: CicloBluetooth
    settings:
      base:
        PRODUCT_NAME: TaylorZwift
        PRODUCT_BUNDLE_IDENTIFIER: studio.martillo.taylorzwift
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Taylor Zwift
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Taylor Zwift usa Bluetooth para conectarse al rodillo y a los mandos.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        # Para el iPhone/iPad: pon aquí tu Team ID (Xcode → Settings → Accounts).
        DEVELOPMENT_TEAM: ""
        # En el Mac: firma local sin cuenta, con sandbox + permiso de Bluetooth.
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": TaylorZwift.entitlements
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES

  # App puente: usa los Zwift Click V2 como mando de MyWhoosh (red OpenBikeControl o teclado).
  TaylorMandos:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: BridgeSources
    dependencies:
      - package: CicloKit
        product: CicloKit
      - package: CicloKit
        product: CicloBluetooth
      - package: CicloKit
        product: CicloNetwork
    info:
      path: TaylorMandos-Info.plist
      properties:
        # Necesario en iOS para anunciarnos por Bonjour en la red local.
        NSBonjourServices: [_openbikecontrol._tcp]
    settings:
      base:
        PRODUCT_NAME: TaylorMandos
        PRODUCT_BUNDLE_IDENTIFIER: studio.martillo.taylormandos
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Taylor Mandos
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Taylor Mandos usa Bluetooth para conectarse a tus Zwift Click.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Taylor Mandos se anuncia en tu red local para que MyWhoosh pueda usar tus Zwift Click como mando.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        # En el Mac: firma local y SIN sandbox (para poder simular teclas en MyWhoosh).
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES
